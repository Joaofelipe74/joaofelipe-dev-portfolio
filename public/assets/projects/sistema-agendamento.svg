<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sistema Inteligente de Gestão e Agendamento</title>
  <desc id="desc">Prévia visual do sistema da JF Dev com painel administrativo e agendamento online.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
